<style>
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --surface-2: #f4f4f2;
  --text: #1a1a1a;
  --muted: #6b7280;
  --border: #e5e7eb;
  --link: #2563eb;
  --code-bg: #f4f4f2;

  /* Per-kind accents (research / spec / plan). */
  --research: #d97706;
  --research-soft: #fef3e2;
  --spec: #4f46e5;
  --spec-soft: #eceafd;
  --plan: #059669;
  --plan-soft: #e3f5ee;

  /* Status pills. */
  --st-draft: #64748b;
  --st-ready: #2563eb;
  --st-active: #d97706;
  --st-done: #059669;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  --maxw: 860px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a;
    --surface: #1e1e24;
    --surface-2: #26262e;
    --text: #e8e8ea;
    --muted: #9ca3af;
    --border: #2f2f38;
    --link: #7aa2f7;
    --code-bg: #26262e;

    --research: #fbbf24;
    --research-soft: #3a2f14;
    --spec: #a5b4fc;
    --spec-soft: #26254a;
    --plan: #34d399;
    --plan-soft: #123a2c;

    --st-draft: #94a3b8;
    --st-ready: #7aa2f7;
    --st-active: #fbbf24;
    --st-done: #34d399;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---- Chrome: header / breadcrumbs / footer ---- */
.site-header {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.site-header .inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.brand {
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text);
  letter-spacing: -.01em;
}
.brand:hover { text-decoration: none; opacity: .8; }
.brand .dot { color: var(--spec); }

.crumbs {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 10px 20px 0;
  font-size: .82rem;
  color: var(--muted);
}
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--text); }
.crumbs .sep { margin: 0 6px; opacity: .5; }

main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 24px 20px 80px;
}

.site-footer {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 24px 20px 40px;
  color: var(--muted);
  font-size: .8rem;
  border-top: 1px solid var(--border);
}

/* ---- Kind theming: set --k / --k-soft on a [data-kind] scope ---- */
[data-kind="research"] { --k: var(--research); --k-soft: var(--research-soft); }
[data-kind="spec"]     { --k: var(--spec);     --k-soft: var(--spec-soft); }
[data-kind="plan"]     { --k: var(--plan);     --k-soft: var(--plan-soft); }

/* Lettered kind badge. */
.kind-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.6em;
  height: 1.6em;
  border-radius: 6px;
  background: var(--k, var(--surface-2));
  color: #fff;
  font-weight: 700;
  font-size: .8rem;
  flex: none;
}
@media (prefers-color-scheme: dark) {
  .kind-badge { color: #16161a; }
}

/* Status pill. */
.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
  background: var(--surface-2);
  color: var(--muted);
  white-space: nowrap;
}
.status::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.status[data-status="draft"]       { color: var(--st-draft); }
.status[data-status="complete"],
.status[data-status="approved"]    { color: var(--st-ready); }
.status[data-status="in-progress"] { color: var(--st-active); }
.status[data-status="done"]        { color: var(--st-done); }

/* ---- Home / repo listings ---- */
.page-title { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -.02em; }
.page-lede { color: var(--muted); margin: 0 0 24px; }

.card-grid { display: grid; gap: 12px; }

.repo-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.repo-card:hover { border-color: var(--muted); text-decoration: none; }
.repo-card .name { font-weight: 600; color: var(--text); }
.repo-card .meta { color: var(--muted); font-size: .85rem; }

/* Effort card: title + R/S/P pipeline chips. */
.effort {
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.effort:hover { border-color: var(--muted); }
.effort .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.effort .slug { font-weight: 600; color: var(--text); }
.effort .slug:hover { text-decoration: none; opacity: .8; }
.effort .date { color: var(--muted); font-size: .8rem; white-space: nowrap; }

.pipeline { display: flex; align-items: stretch; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.stage {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px 7px 8px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--k, var(--border));
  border-radius: 8px;
  background: var(--surface);
  min-width: 130px;
}
.stage:hover { background: var(--k-soft); text-decoration: none; }
.stage.absent { opacity: .45; border-left-style: dashed; }
.stage .txt { display: flex; flex-direction: column; line-height: 1.25; }
.stage .txt .lbl { font-size: .82rem; font-weight: 600; color: var(--text); }
.stage .txt .st { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.pipe-arrow { align-self: center; color: var(--muted); opacity: .5; }

/* ---- Single artifact ---- */
.artifact-hero {
  border: 1px solid var(--border);
  border-left: 5px solid var(--k, var(--border));
  border-radius: var(--radius);
  background: var(--k-soft);
  padding: 18px 20px;
  margin-bottom: 8px;
}
.artifact-hero .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.artifact-hero .kind-name { font-weight: 700; color: var(--k); letter-spacing: .01em; }
.artifact-hero h1 { font-size: 1.55rem; margin: 10px 0 0; letter-spacing: -.02em; line-height: 1.25; }
.artifact-hero .facts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--muted); }
.artifact-hero .facts .tag { background: var(--surface); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; }

/* Sibling switcher research | spec | plan */
.switch { display: flex; gap: 6px; margin: 14px 0 26px; flex-wrap: wrap; }
.switch a, .switch span {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: .85rem;
  color: var(--muted);
  background: var(--surface);
}
.switch a:hover { text-decoration: none; border-color: var(--k); color: var(--text); }
.switch .current { border-color: var(--k); color: var(--k); font-weight: 600; background: var(--k-soft); }
.switch .missing { opacity: .4; cursor: default; }

/* ---- Prose ---- */
.prose { color: var(--text); }
/* Artifacts lead with a `# <title>` H1 that repeats the hero title; the hero
   owns the title, so drop the redundant leading heading. */
.prose > h1:first-child { display: none; }
.prose h1, .prose h2, .prose h3 { letter-spacing: -.01em; line-height: 1.3; margin: 1.8em 0 .6em; }
.prose h2 { font-size: 1.3rem; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
.prose h3 { font-size: 1.1rem; }
.prose p, .prose li { overflow-wrap: break-word; }
.prose a { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); }
.prose code {
  background: var(--code-bg);
  padding: .15em .4em;
  border-radius: 5px;
  font-size: .88em;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.prose pre {
  background: var(--code-bg);
  padding: 14px 16px;
  border-radius: 8px;
  overflow-x: auto;
  border: 1px solid var(--border);
}
.prose pre code { background: none; padding: 0; font-size: .85em; }
.prose blockquote {
  margin: 1em 0;
  padding: .2em 1em;
  border-left: 3px solid var(--border);
  color: var(--muted);
}
.prose table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .92em; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.prose th { background: var(--surface-2); font-weight: 600; }
.prose tr:nth-child(even) td { background: var(--surface-2); }
.prose img { max-width: 100%; }
.prose hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
.prose pre.mermaid { background: var(--surface); border: 1px solid var(--border); text-align: center; }

/* Click-to-zoom for images and mermaid diagrams. */
.prose img, .prose pre.mermaid { cursor: zoom-in; }
.zoom-backdrop {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.82);
}
.zoom-backdrop > img {
  width: auto; height: auto;
  max-width: 96vw; max-height: 96vh;
  cursor: zoom-out;
}
.mermaid-viewer {
  position: relative;
  width: calc(100vw - 48px);
  height: calc(100vh - 48px);
  overflow: hidden;
  border-radius: 8px;
  background: var(--surface);
}
.mermaid-viewer-viewport {
  width: 100%; height: 100%; overflow: hidden;
  cursor: grab; touch-action: none; user-select: none;
}
.mermaid-viewer-viewport.dragging { cursor: grabbing; }
.mermaid-viewer-viewport > pre.mermaid {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; margin: 0; padding: 20px;
  overflow: hidden; border: 0; background: var(--surface);
}
.mermaid-viewer-viewport svg {
  width: 100% !important; height: 100% !important; max-width: none !important;
  transform: translate(var(--mermaid-pan-x, 0), var(--mermaid-pan-y, 0)) scale(var(--mermaid-zoom, 1));
  transform-origin: center;
}
.mermaid-viewer-control-panel {
  position: absolute; top: 12px; right: 12px;
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px;
  max-width: calc(100% - 24px); padding: 5px;
  border: 1px solid var(--border); border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  box-shadow: var(--shadow);
}
.mermaid-viewer-control-panel .btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text);
  font: 600 1rem/1 sans-serif; cursor: pointer;
}
.mermaid-viewer-control-panel .btn:hover { border-color: var(--muted); background: var(--surface-2); }
.mermaid-viewer-control-panel .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
@media (max-width: 600px) {
  .zoom-backdrop { padding: 8px; }
  .mermaid-viewer { width: calc(100vw - 16px); height: calc(100vh - 16px); }
  .mermaid-viewer-control-panel { top: 8px; right: 8px; max-width: calc(100% - 16px); }
}

.empty { color: var(--muted); font-style: italic; padding: 20px 0; }
</style>
